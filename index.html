<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Инна Горулько · услуги</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Фирменные цвета — меняйте здесь */
    --bg: #071113;
    --card: rgba(14, 32, 35, .62);
    --line: rgba(110, 220, 205, .16);
    --text: #F1F6F5;
    --muted: #94ABA8;
    --accent: #5FDCCB;                 /* бирюза */
    --accent-soft: rgba(95, 220, 203, .12);
    --grad: linear-gradient(100deg, #0F6E6C 0%, #1B4FB3 100%);   /* плашки как на карточках тарифов */
    --main-btn: #13807B;               /* цвет родной кнопки Telegram (только сплошной цвет) */
    --radius: 18px;
    --gold: #E4C78F;                   /* золото-беж для иконок */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    color: var(--text);
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14.5px; line-height: 1.5;
    padding: 0 16px calc(96px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; min-height: 100vh;
  }
  #app { position: relative; z-index: 1; }
  a { color: inherit; text-decoration: none; }

  /* Фон: медленно плывущие сияния */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aurora { position: absolute; width: 110vmax; height: 110vmax; border-radius: 50%; will-change: transform; }
  .a1 { top: -62vmax; left: -55vmax; background: radial-gradient(closest-side, rgba(20, 140, 112, .34), transparent); animation: drift1 24s ease-in-out infinite alternate; }
  .a2 { top: 12vh; right: -68vmax; background: radial-gradient(closest-side, rgba(27, 79, 179, .26), transparent); animation: drift2 30s ease-in-out infinite alternate; }
  .a3 { bottom: -72vmax; left: -40vmax; background: radial-gradient(closest-side, rgba(20, 140, 112, .2), transparent); animation: drift3 36s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(22vw, 16vh) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-20vw, 22vh) scale(.92); } }
  @keyframes drift3 { to { transform: translate(18vw, -18vh) scale(1.08); } }
  button { font-family: inherit; }
  .serif { font-family: "Cormorant Garamond", Georgia, serif; }

  /* Шапка */
  .hero { text-align: center; padding-bottom: 6px; }
  /* Шапка как обложка: слева имя, справа крупное фото с телефоном, рядом всплывают сообщения */
  .stage { position: relative; height: 410px; margin: 0 -16px; overflow: hidden; text-align: left; }
  /* Фото + ореол за спиной + волны от телефона. Размер 480×626 — пропорции portrait.webp */
  .figure-wrap { position: absolute; right: -18px; bottom: 0; z-index: 1; height: 372px; aspect-ratio: 480 / 626; }
  .figure {
    position: relative; z-index: 1; display: block; height: 100%;
    -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent); mask-image: linear-gradient(180deg, #000 80%, transparent);
  }
  .figure img { display: block; height: 100%; width: auto; }
  .halo { position: absolute; left: 50%; top: 40%; width: 330px; height: 330px; transform: translate(-50%, -50%); pointer-events: none; }
  .halo::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(95, 220, 203, .42), rgba(27, 79, 179, .2) 58%, transparent);
    animation: breathe 6s ease-in-out infinite;
  }
  /* Тонкое кольцо с бирюзовым и золотым бликом — медленно вращается */
  .ring {
    position: absolute; inset: 22px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 8%, var(--accent) 22%, transparent 38%, transparent 55%, var(--gold) 72%, transparent 88%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    filter: drop-shadow(0 0 6px rgba(95, 220, 203, .8));
    animation: spin 16s linear infinite;
  }
  .orbit { position: absolute; inset: 58px; border-radius: 50%; border: 1px dashed rgba(228, 199, 143, .28); animation: spin 50s linear infinite reverse; }
  .orbit::after { content: ""; position: absolute; top: -4px; left: 50%; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
  /* Волны от телефона, как сигнал о новом сообщении */
  .ripple { position: absolute; left: 37%; top: 68%; z-index: 2; pointer-events: none; }
  .ripple i {
    position: absolute; left: 0; top: 0; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%;
    border: 1.5px solid rgba(95, 220, 203, .7); box-shadow: 0 0 12px rgba(95, 220, 203, .4);
    opacity: 0; animation: ripple 3.6s ease-out infinite;
  }
  .ripple i:nth-child(2) { animation-delay: 1.2s; }
  .ripple i:nth-child(3) { animation-delay: 2.4s; }
  @keyframes ripple { 0% { transform: scale(.25); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
  .title { position: absolute; left: 16px; top: 34px; z-index: 2; }
  .kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  .roles { list-style: none; margin-top: 12px; font-size: 12.5px; line-height: 1.6; color: #C3D2D0; }
  .roles li::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); margin: 0 8px 2px 0; }
  /* Всплывающие сообщения от клиентов */
  .msg { position: absolute; z-index: 3; animation: float 6s ease-in-out infinite; }
  .msg-in {
    display: flex; gap: 8px; align-items: center; max-width: 188px; padding: 8px 12px 8px 8px;
    border-radius: 16px 16px 16px 5px; font-size: 12.5px; line-height: 1.3;
    background: rgba(14, 36, 40, .78); border: 1px solid rgba(95, 220, 203, .3);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 12px 28px rgba(0, 0, 0, .45), 0 0 18px rgba(95, 220, 203, .12);
    opacity: 0; animation: flyin 1s cubic-bezier(.2, .8, .2, 1) forwards;
  }
  .msg small { display: block; font-size: 10.5px; color: var(--muted); }
  .msg .ava { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--grad); }
  .msg .ava.gold { background: linear-gradient(135deg, #F1D9A6, #B8904F); color: #2A1E08; }
  .m1 { left: 16px; top: 238px; }
  .m1 .msg-in { animation-delay: .6s; }
  .m2 { left: 30px; top: 306px; animation-delay: -3s; }
  .m2 .msg-in { animation-delay: 1.8s; }
  /* Сообщение прилетает слева, чуть разворачивается и «пружинит» на месте */
  @keyframes flyin {
    0% { opacity: 0; transform: translate(-160px, 46px) rotate(-12deg) scale(.7); filter: blur(5px); }
    55% { opacity: 1; transform: translate(10px, -5px) rotate(2deg) scale(1.04); filter: blur(0); }
    78% { transform: translate(-3px, 1px) rotate(-.6deg) scale(.99); }
    100% { opacity: 1; transform: none; filter: none; }
  }
  /* Когда сообщение долетело — аватар коротко вспыхивает */
  .msg .ava { animation: ping 1s ease-out backwards; }
  .m1 .ava { animation-delay: 1.15s; }
  .m2 .ava { animation-delay: 2.35s; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(95, 220, 203, .8); } 100% { box-shadow: 0 0 0 12px rgba(95, 220, 203, 0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .name { font-family: "Cormorant Garamond", Georgia, serif; font-size: 46px; font-weight: 700; line-height: .95; margin-top: 8px; text-shadow: 0 2px 18px rgba(0, 0, 0, .55); }
  .plaque {
    display: inline-block; margin-top: 12px; padding: 10px 16px; border-radius: 14px;
    background: var(--grad); font-size: 14.5px; font-weight: 500; line-height: 1.4;
    box-shadow: 0 8px 24px rgba(15, 110, 108, .3);
  }
  .about { margin-top: 16px; color: #C3D2D0; font-size: 14.5px; line-height: 1.6; }
  .about b { color: var(--accent); font-weight: 600; white-space: nowrap; }

  /* Навигация по разделам */
  .nav {
    position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; overflow-x: auto;
    margin: 16px -16px 0; padding: 12px 16px;
    background: rgba(7, 17, 19, .92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 8px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    background: var(--card); border: 1px solid var(--line); cursor: pointer;
  }
  .chip:active { background: var(--accent-soft); }

  section { margin-top: 26px; scroll-margin-top: 64px; }
  h2 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 28px; font-weight: 700; line-height: 1.1; margin-bottom: 12px; }
  h2 small { display: block; font-family: "Montserrat", sans-serif; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 4px; }

  /* Бесплатный разбор */
  .gift { border-radius: var(--radius); padding: 18px; background: var(--grad); box-shadow: 0 10px 30px rgba(15, 110, 108, .25); }
  .gift .label { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .gift h3 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 26px; font-weight: 700; line-height: 1.1; margin: 6px 0 8px; }
  .gift p { font-size: 14px; opacity: .92; }
  .gift ul { list-style: none; margin: 12px 0 14px; }
  .gift li { padding-left: 24px; position: relative; margin: 5px 0; font-size: 13.5px; }
  .gift li::before { content: "✓"; position: absolute; left: 0; top: 1px; width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.2); font-size: 10px; font-weight: 800; display: grid; place-items: center; }
  .gift .btn { background: #fff; color: #0C3F4A; }
  .gift .how { font-size: 12.5px; opacity: .8; margin-top: 10px; text-align: center; }

  /* Карточки услуг */
  .service {
    background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
    border: 1px solid var(--line); cursor: pointer;
  }
  .service.open { border-color: rgba(95, 220, 203, .4); }
  .service-top { display: flex; gap: 12px; align-items: flex-start; }
  .service-emoji { flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; font-size: 20px; }
  /* Золотые линейные иконки в стеклянной плашке */
  .ic {
    color: var(--gold);
    background: linear-gradient(145deg, rgba(228, 199, 143, .16), rgba(228, 199, 143, .03));
    border: 1px solid rgba(228, 199, 143, .32);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 0 16px rgba(228, 199, 143, .1);
  }
  .ic svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px rgba(228, 199, 143, .55)); }
  .service-main { flex: 1; min-width: 0; }
  .service-title { font-weight: 700; font-size: 15.5px; line-height: 1.3; }
  .service-short { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
  .service-price { flex: none; font-weight: 700; color: var(--accent); white-space: nowrap; font-size: 14.5px; }
  .service-price.ask { font-weight: 600; color: var(--muted); font-size: 12.5px; }
  .service-more { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .service.open .service-more { display: block; }
  .more-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .service-more ul { list-style: none; margin-bottom: 12px; }
  .service-more li { padding-left: 24px; position: relative; margin: 6px 0; font-size: 14px; }
  .service-more li::before { content: "✓"; position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #2BB673; color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; }
  .opts { display: grid; gap: 6px; margin-bottom: 14px; }
  .opt { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; }
  .opt b { padding: 4px 10px; border-radius: 9px; background: var(--grad); font-weight: 600; font-size: 13.5px; }
  .note { font-size: 13.5px; margin-bottom: 12px; }
  .note b { color: var(--accent); }
  .fit { font-size: 13px; color: var(--muted); background: rgba(255,255,255,.03); border-left: 2px solid var(--accent); padding: 8px 10px; border-radius: 0 10px 10px 0; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }

  .btn {
    display: block; width: 100%; text-align: center; padding: 13px 14px; border: 0; border-radius: 14px;
    background: var(--grad); color: #fff; font-size: 14.5px; font-weight: 600; cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }

  /* Кейсы — змейка по 3 в ряд, соединённая светящейся линией */
  .snake { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 24px; padding: 4px 18px; }
  .snake svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; filter: drop-shadow(0 0 5px rgba(95, 220, 203, .9)); }
  .snake .track { fill: none; stroke: rgba(95, 220, 203, .45); stroke-width: 2.4; }
  .snake .flow { fill: none; stroke: #BFFFF5; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 3 11; animation: flow 1.2s linear infinite; }
  .snake .spark { fill: #E9FFFB; }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  .case {
    position: relative; z-index: 1; cursor: pointer; text-align: center; min-width: 0;
    background: #0D2023; border: 1px solid var(--line); border-radius: 14px; padding: 9px 6px 10px;
    box-shadow: 0 8px 18px rgba(0, 0, 0, .3);
  }
  .case:active { background: #123033; }
  .case-num { font-family: "Cormorant Garamond", Georgia, serif; font-size: 15px; font-weight: 700; color: var(--gold); line-height: 1; }
  .case-name { font-weight: 700; font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .case-niche { color: var(--muted); font-size: 11px; line-height: 1.3; }

  @media (prefers-reduced-motion: reduce) {
    .aurora, .msg, .msg .ava, .snake .flow, .halo::before, .ring, .orbit { animation: none; }
    .ripple { display: none; }
    .msg-in { animation: none; opacity: 1; }
    .snake .spark { display: none; }
  }

  /* Список ссылок */
  .list { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
  .item { display: flex; gap: 12px; align-items: center; padding: 13px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item:active { background: var(--accent-soft); }
  .item-emoji { flex: none; font-size: 19px; width: 26px; text-align: center; }
  .item-emoji.ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; }
  .item-emoji.ic svg { width: 18px; height: 18px; }
  .item-main { flex: 1; min-width: 0; }
  .item-title { font-weight: 600; font-size: 14px; }
  .item-desc { color: var(--muted); font-size: 12.5px; }
  .item-arrow { color: var(--muted); font-size: 18px; }

  /* Отзывы */
  .reviews { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .reviews::-webkit-scrollbar { display: none; }
  .review { flex: none; width: 84%; scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; }
  .review .quote { font-family: "Cormorant Garamond", Georgia, serif; font-size: 46px; line-height: .6; color: var(--accent); height: 22px; }
  .review p { font-size: 14px; flex: 1; }
  .review .who { margin-top: 10px; font-weight: 700; font-size: 13px; }
  .review .who span { font-weight: 400; color: var(--muted); }

  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 30px; }
  footer p + p { margin-top: 6px; }
  footer a { color: var(--accent); font-weight: 600; cursor: pointer; }

  /* Кнопка внизу — только при просмотре в браузере. В Telegram её заменяет родная кнопка */
  .sticky-cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 35%); }
  .sticky-cta .btn { max-width: 528px; margin: 0 auto; box-shadow: 0 8px 24px rgba(15, 110, 108, .4); }
  .in-tg .sticky-cta { display: none; }

  /* Карточка тарифа (картинка) внутри раскрытого тарифа */
  .service-img { display: block; width: 100%; border-radius: 14px; margin-bottom: 14px; background: #0C1B1E; aspect-ratio: 1 / 1; object-fit: cover; }
</style>
</head>

  // Сообщения, которые всплывают рядом с фото

  // price — на карточке; options — варианты с ценами; note — строка про стоимость;

const tg = window.Telegram && window.Telegram.WebApp;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function haptic() {
  if (inTelegram && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
}

// Ссылки на Telegram: сначала закрываем приложение, сразу после — открываем ссылку.
// Если открыть ссылку первой, на iPhone приложение остаётся поверх.
function openUrl(url) {
  haptic();
  if (!inTelegram) { window.open(url, "_blank"); return; }
  if (url.startsWith("https://t.me/")) {
    tg.close();
    tg.openTelegramLink(url);
  } else {
    tg.openLink(url);
  }
}

function icon(name) {

// Последний кейс стоит один в ряду (например, 10-й при трёх в ряд)
function loneCase(cases) {
  return cases.length > 3 && cases.length % 3 === 1;
}

// Линия змейки кейсов: прямо между карточками в ряду, полукругом на поворотах.
// Одинокий последний кейс подключается отдельной линией от карточки над ним
function drawSnake() {
  const snake = document.querySelector(".snake");
  if (!snake) return;
  const box = snake.getBoundingClientRect();
  const cards = [...snake.querySelectorAll(".case")].map(el => {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2 - box.left, y: r.top + r.height / 2 - box.top, half: r.width / 2 };
  });
  if (cards.length < 2) return;
  const lone = loneCase(cards), main = lone ? cards.slice(0, -1) : cards;
  let d = `M${main[0].x} ${main[0].y}`;
  for (let i = 1; i < main.length; i++) {
    const a = main[i - 1], b = main[i];
    if (i % 3) { d += ` L${b.x} ${b.y}`; continue; }
    // Поворот на следующий ряд: дуга снаружи карточек
    const side = a.x > box.width / 2 ? 1 : -1, out = a.x + side * (a.half + 16);
    d += ` C${out} ${a.y} ${out} ${b.y} ${b.x} ${b.y}`;
  }
  snake.querySelectorAll("path.main").forEach(p => p.setAttribute("d", d));
  if (lone) {
    const above = cards[cards.length - 3], last = cards[cards.length - 1];
    snake.querySelectorAll("path.branch").forEach(p => p.setAttribute("d", `M${above.x} ${above.y} L${last.x} ${last.y}`));
  }
}

function bindEvents() {
  document.addEventListener("click", e => {
    const link = e.target.closest("[data-url]");
    if (link) { e.stopPropagation(); openUrl(link.dataset.url); return; }

    const go = e.target.closest("[data-go]");
    if (go) { haptic(); document.getElementById(go.dataset.go).scrollIntoView({ behavior: "smooth" }); return; }

    const card = e.target.closest("[data-service]");
    if (card) { haptic(); card.classList.toggle("open"); }
  });
}

function initTelegram() {
  if (!inTelegram) return;
  document.body.classList.add("in-tg");
  tg.ready();
  tg.expand();
  const css = getComputedStyle(document.documentElement);
  const bg = css.getPropertyValue("--bg").trim();
  tg.setHeaderColor(bg);
  tg.setBackgroundColor(bg);

  // Родная кнопка Telegram внизу экрана
  tg.MainButton.setParams({
    text: CONFIG.bookingLabel,
    color: css.getPropertyValue("--main-btn").trim(),
    text_color: "#FFFFFF",
  });
  tg.MainButton.onClick(() => openUrl(CONFIG.bookingUrl));
  tg.MainButton.show();
}
