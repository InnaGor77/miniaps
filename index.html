<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Инна Горулько · услуги</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Фирменные цвета — меняйте здесь */
    --bg: #071113;
    --card: rgba(14, 32, 35, .62);
    --line: rgba(110, 220, 205, .16);
    --text: #F1F6F5;
    --muted: #94ABA8;
    --accent: #5FDCCB;                 /* бирюза */
    --accent-soft: rgba(95, 220, 203, .12);
    --grad: linear-gradient(100deg, #0F6E6C 0%, #1B4FB3 100%);   /* плашки как на карточках тарифов */
    --main-btn: #13807B;               /* цвет родной кнопки Telegram (только сплошной цвет) */
    --radius: 18px;
    --gold: #D6B266;                   /* золото-беж для иконок */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    color: var(--text);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14.5px; line-height: 1.5;
    padding: 0 16px calc(96px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; min-height: 100vh;
  }
  #app { position: relative; z-index: 1; }
  a { color: inherit; text-decoration: none; }

  /* Фон: медленно плывущие сияния */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aurora { position: absolute; width: 110vmax; height: 110vmax; border-radius: 50%; will-change: transform; }
  .a1 { top: -62vmax; left: -55vmax; background: radial-gradient(closest-side, rgba(20, 140, 112, .34), transparent); animation: drift1 24s ease-in-out infinite alternate; }
  .a2 { top: 12vh; right: -68vmax; background: radial-gradient(closest-side, rgba(27, 79, 179, .26), transparent); animation: drift2 30s ease-in-out infinite alternate; }
  .a3 { bottom: -72vmax; left: -40vmax; background: radial-gradient(closest-side, rgba(20, 140, 112, .2), transparent); animation: drift3 36s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(22vw, 16vh) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-20vw, 22vh) scale(.92); } }
  @keyframes drift3 { to { transform: translate(18vw, -18vh) scale(1.08); } }
  button { font-family: inherit; }
  .serif { font-family: "Cormorant Garamond", Georgia, serif; }

  /* Шапка */
  .hero { text-align: center; padding-bottom: 6px; }
  /* Шапка как обложка: слева имя, справа крупное фото с телефоном, рядом всплывают сообщения */
  .stage { position: relative; height: 410px; margin: 0 -16px; overflow: hidden; text-align: left; }
  /* Фото + ореол за спиной + волны от телефона. Размер 480×626 — пропорции portrait.webp */
  .figure-wrap { position: absolute; right: -18px; bottom: 0; z-index: 1; height: 372px; aspect-ratio: 480 / 626; }
  .figure {
    position: relative; z-index: 1; display: block; height: 100%;
    -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent); mask-image: linear-gradient(180deg, #000 80%, transparent);
  }
  .figure img { display: block; height: 100%; width: auto; }
  .halo { position: absolute; left: 50%; top: 40%; width: 330px; height: 330px; transform: translate(-50%, -50%); pointer-events: none; }
  .halo::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(95, 220, 203, .42), rgba(27, 79, 179, .2) 58%, transparent);
    animation: breathe 6s ease-in-out infinite;
  }
  /* Тонкое кольцо с бирюзовым и золотым бликом — медленно вращается */
  .ring {
    position: absolute; inset: 22px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 8%, var(--accent) 22%, transparent 38%, transparent 55%, var(--gold) 72%, transparent 88%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    filter: drop-shadow(0 0 6px rgba(95, 220, 203, .8));
    animation: spin 16s linear infinite;
  }
  .orbit { position: absolute; inset: 58px; border-radius: 50%; border: 1px dashed rgba(228, 199, 143, .28); animation: spin 50s linear infinite reverse; }
  .orbit::after { content: ""; position: absolute; top: -4px; left: 50%; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
  /* Волны от телефона, как сигнал о новом сообщении */
  .ripple { position: absolute; left: 37%; top: 68%; z-index: 2; pointer-events: none; }
  .ripple i {
    position: absolute; left: 0; top: 0; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%;
    border: 1.5px solid rgba(95, 220, 203, .7); box-shadow: 0 0 12px rgba(95, 220, 203, .4);
    opacity: 0; animation: ripple 3.6s ease-out infinite;
  }
  .ripple i:nth-child(2) { animation-delay: 1.2s; }
  .ripple i:nth-child(3) { animation-delay: 2.4s; }
  @keyframes ripple { 0% { transform: scale(.25); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
  .title { position: absolute; left: 16px; top: 34px; z-index: 2; }
  .kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  .roles { list-style: none; margin-top: 12px; font-size: 12.5px; line-height: 1.6; color: #C3D2D0; }
  .roles li::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); margin: 0 8px 2px 0; }
  /* Всплывающие сообщения от клиентов */
  .msg { position: absolute; z-index: 3; animation: float 6s ease-in-out infinite; }
  .msg-in {
    display: flex; gap: 8px; align-items: center; max-width: 188px; padding: 8px 12px 8px 8px;
    border-radius: 16px 16px 16px 5px; font-size: 12.5px; line-height: 1.3;
    background: rgba(14, 36, 40, .78); border: 1px solid rgba(95, 220, 203, .3);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 12px 28px rgba(0, 0, 0, .45), 0 0 18px rgba(95, 220, 203, .12);
    opacity: 0; animation: flyin 1s cubic-bezier(.2, .8, .2, 1) forwards;
  }
  .msg small { display: block; font-size: 10.5px; color: var(--muted); }
  .msg .ava { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--grad); }
  .msg .ava.gold { background: linear-gradient(135deg, #F1D9A6, #B8904F); color: #2A1E08; }
  .m1 { left: 16px; top: 238px; }
  .m1 .msg-in { animation-delay: .6s; }
  .m2 { left: 30px; top: 306px; animation-delay: -3s; }
  .m2 .msg-in { animation-delay: 1.8s; }
  /* Сообщение прилетает слева, чуть разворачивается и «пружинит» на месте */
  @keyframes flyin {
    0% { opacity: 0; transform: translate(-160px, 46px) rotate(-12deg) scale(.7); filter: blur(5px); }
    55% { opacity: 1; transform: translate(10px, -5px) rotate(2deg) scale(1.04); filter: blur(0); }
    78% { transform: translate(-3px, 1px) rotate(-.6deg) scale(.99); }
    100% { opacity: 1; transform: none; filter: none; }
  }
  /* Когда сообщение долетело — аватар коротко вспыхивает */
  .msg .ava { animation: ping 1s ease-out backwards; }
  .m1 .ava { animation-delay: 1.15s; }
  .m2 .ava { animation-delay: 2.35s; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(95, 220, 203, .8); } 100% { box-shadow: 0 0 0 12px rgba(95, 220, 203, 0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .name { font-family: "Cormorant Garamond", Georgia, serif; font-size: 46px; font-weight: 700; line-height: .95; margin-top: 8px; text-shadow: 0 2px 18px rgba(0, 0, 0, .55); }
  .plaque {
    display: inline-block; margin-top: 12px; padding: 10px 16px; border-radius: 14px;
    background: var(--grad); font-size: 14.5px; font-weight: 500; line-height: 1.4;
    box-shadow: 0 8px 24px rgba(15, 110, 108, .3);
  }
  .about { margin-top: 16px; color: #C3D2D0; font-size: 14.5px; line-height: 1.6; }
  .about b { color: var(--accent); font-weight: 600; white-space: nowrap; }


  /* ===== Новая шапка (образец 16.11.2026): УТП крупно, фото меньше, переписка помощников ===== */
  .hero2 { padding-top: 22px; }
  .who { display: flex; align-items: center; gap: 10px; }
  .who-name { font-weight: 700; font-size: 15px; }
  .who-kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-top: 1px; }
  .utp { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 38px; line-height: 1.02; text-transform: uppercase; margin-top: 18px; letter-spacing: .005em; }
  .utp em { font-style: normal; color: var(--accent); white-space: nowrap; }
  .utp-sub { font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 500; font-size: 21px; color: var(--gold); margin-top: 8px; line-height: 1.2; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .tags span { padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #C3D2D0; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); }
  .stage2 { position: relative; height: 320px; margin: 10px -16px 0; overflow: hidden; }
  .stage2 .figure-wrap { right: -24px; height: 300px; }
  .stage2 .halo { width: 260px; height: 260px; }
  /* Чат помощников */
  .chat {
    position: absolute; left: 16px; bottom: 16px; z-index: 3; width: 214px; height: 252px; overflow: hidden;
    padding: 10px; border-radius: 20px;
    background: rgba(10, 26, 29, .72); border: 1px solid rgba(242, 246, 245, .16);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
  }
  .chat-head { display: flex; align-items: center; gap: 8px; padding: 0 2px 8px; border-bottom: 1px solid rgba(242, 246, 245, .1); font-size: 12px; font-weight: 700; }
  .chat-head small { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); }
  .chat-head .faces { display: flex; }
  .chat-head .faces img { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #0A1A1D; margin-left: -7px; object-fit: cover; }
  .chat-head .faces img:first-child { margin-left: 0; }
  .chat-feed { position: absolute; left: 10px; right: 10px; top: 50px; bottom: 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 7px; }
  .cm { flex: none; }
  .cm { display: flex; gap: 6px; align-items: flex-end; animation: cmIn .5s cubic-bezier(.2, .8, .2, 1) both; }
  .cm img { flex: none; width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
  .cm-b { padding: 6px 9px; border-radius: 12px 12px 12px 4px; font-size: 11.5px; line-height: 1.3; background: rgba(95, 220, 203, .08); border: 1px solid rgba(95, 220, 203, .45); }
  .cm-b small { display: block; font-size: 10px; font-weight: 700; color: var(--accent); }
  .cm.me { justify-content: flex-end; }
  .cm.me .cm-b { background: rgba(242, 246, 245, .92); color: #0B1A1C; border: 0; border-radius: 12px 12px 4px 12px; font-weight: 500; }
  .typing { display: inline-flex; gap: 3px; padding: 9px 10px; }
  .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .4; animation: dot 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 50% { opacity: 1; transform: translateY(-2px); } }
  @keyframes cmIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  .chat-feed.out { animation: feedOut .45s ease-in forwards; }
  @keyframes feedOut { to { opacity: 0; transform: translateY(-12px); } }
  .hero2 .about { text-align: left; margin-top: 14px; }
  @media (prefers-reduced-motion: reduce) { .cm, .typing i, .chat-feed.out { animation: none; } }

  /* Навигация по разделам */
  .nav {
    position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; overflow-x: auto;
    margin: 16px -16px 0; padding: 12px 16px;
    background: rgba(7, 17, 19, .92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 8px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    background: var(--card); border: 1px solid var(--line); cursor: pointer;
  }
  .chip:active { background: var(--accent-soft); }

  section { margin-top: 26px; scroll-margin-top: 64px; }
  h2 { font-family: "Oswald", sans-serif; font-size: 26px; font-weight: 600; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; margin-bottom: 12px; }
  h2 small { display: block; font-family: "Manrope", sans-serif; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 4px; }

  /* Интерактив «Что отдать ИИ-помощнику» */
  .quiz { border-radius: var(--radius); padding: 18px 16px; background: var(--card); border: 1px solid var(--line); }
  .quiz h3 { font-family: "Oswald", sans-serif; font-size: 24px; font-weight: 600; line-height: 1.05; text-transform: uppercase; }
  .quiz-text { color: #C3D2D0; font-size: 13.5px; margin-top: 6px; }
  /* Команда прилипает под навигацией, чтобы было видно, как она собирается */
  .team { position: sticky; top: 60px; z-index: 2; display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; margin: 14px -16px 12px; padding: 10px 8px; background: rgba(9, 22, 25, .94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 0 0 16px 16px; }
  .mate { text-align: center; min-width: 0; opacity: .45; filter: grayscale(.85); transition: opacity .4s, filter .4s; }
  .mate-ava { position: relative; width: 50px; height: 50px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed rgba(228, 199, 143, .4); transition: transform .4s cubic-bezier(.3, 1.6, .5, 1), border-color .4s, box-shadow .4s; }
  .mate-ava img { width: calc(100% - 6px); height: calc(100% - 6px); border-radius: 50%; object-fit: cover; }
  .mate-ava .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .mate-name { font-weight: 700; font-size: 12px; margin-top: 6px; }
  .mate-role { hyphens: auto; color: var(--muted); font-size: 10px; line-height: 1.2; margin-top: 2px; }
  .mate.on { opacity: 1; filter: none; }
  .mate.on .mate-ava { border: 1.5px solid var(--gold); transform: scale(1.08); box-shadow: 0 0 0 4px rgba(228, 199, 143, .1), 0 0 22px rgba(228, 199, 143, .35); }
  .mate.pop .mate-ava { animation: pop .5s ease-out; }
  @keyframes pop { 0% { box-shadow: 0 0 0 0 rgba(228, 199, 143, .7); } 100% { box-shadow: 0 0 0 16px rgba(228, 199, 143, 0); } }
  .tasks { display: flex; flex-wrap: wrap; gap: 8px; }
  .task {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; cursor: pointer;
    background: rgba(255, 255, 255, .04); border: 1px solid var(--line); color: var(--text);
    font-size: 13px; font-weight: 500; line-height: 1.3; text-align: left; transition: background .2s, border-color .2s;
  }
  .task i { flex: none; width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--muted); position: relative; transition: background .2s, border-color .2s; }
  .task.on { background: var(--accent-soft); border-color: rgba(95, 220, 203, .5); }
  .task.on i { background: var(--accent); border-color: var(--accent); }
  .task.on i::after { content: ""; position: absolute; left: 4px; top: 0; width: 4px; height: 8px; border: solid #062A2A; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .verdict { margin-top: 16px; }
  .verdict .hint { text-align: center; color: var(--muted); font-size: 13px; padding: 12px; border: 1px dashed var(--line); border-radius: 14px; }
  .pick { border-radius: 14px; padding: 14px; background: var(--grad); margin-bottom: 8px; animation: rise .35s ease-out; }
  .pick.alt { background: rgba(255, 255, 255, .05); border: 1px solid var(--line); }
  .pick-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
  .pick-row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-top: 4px; }
  .pick-title { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .pick-price { flex: none; font-weight: 700; white-space: nowrap; }
  .pick.alt .pick-price { color: var(--accent); }
  .pick-why { font-size: 12.5px; opacity: .85; margin-top: 3px; }
  .verdict .btn { margin-top: 6px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .pick, .mate.pop .mate-ava { animation: none; } }

  /* Бесплатный разбор */
  .gift { border-radius: var(--radius); padding: 18px; background: var(--grad); box-shadow: 0 10px 30px rgba(15, 110, 108, .25); }
  .gift .label { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .gift h3 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 26px; font-weight: 700; line-height: 1.1; margin: 6px 0 8px; }
  .gift p { font-size: 14px; opacity: .92; }
  .gift ul { list-style: none; margin: 12px 0 14px; }
  .gift li { padding-left: 24px; position: relative; margin: 5px 0; font-size: 13.5px; }
  .gift li::before { content: "✓"; position: absolute; left: 0; top: 1px; width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.2); font-size: 10px; font-weight: 800; display: grid; place-items: center; }
  .gift .btn { background: #fff; color: #0C3F4A; }
  .gift .how { font-size: 12.5px; opacity: .8; margin-top: 10px; text-align: center; }

  /* Карточки услуг */
  .service {
    background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
    border: 1px solid var(--line); cursor: pointer;
  }
  .service.open { border-color: rgba(95, 220, 203, .4); }
  .service-top { display: flex; gap: 12px; align-items: flex-start; }
  .service-emoji { flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; font-size: 20px; }
  /* Золотые линейные иконки в стеклянной плашке */
  .ic {
    color: var(--gold);
    background: linear-gradient(145deg, rgba(228, 199, 143, .16), rgba(228, 199, 143, .03));
    border: 1px solid rgba(228, 199, 143, .32);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 0 16px rgba(228, 199, 143, .1);
  }
  .ic svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px rgba(228, 199, 143, .55)); }
  .service-main { flex: 1; min-width: 0; }
  .service-title { font-weight: 700; font-size: 15.5px; line-height: 1.3; }
  .service-short { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
  .service-price { flex: none; font-weight: 700; color: var(--accent); white-space: nowrap; font-size: 14.5px; }
  .service-price.ask { font-weight: 600; color: var(--muted); font-size: 12.5px; }
  .service-more { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .service.open .service-more { display: block; }
  .more-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .service-more ul { list-style: none; margin-bottom: 12px; }
  .service-more li { padding-left: 24px; position: relative; margin: 6px 0; font-size: 14px; }
  .service-more li::before { content: "✓"; position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #2BB673; color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; }
  .opts { display: grid; gap: 6px; margin-bottom: 14px; }
  .opt { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; }
  .opt b { padding: 4px 10px; border-radius: 9px; background: var(--grad); font-weight: 600; font-size: 13.5px; }
  .note { font-size: 13.5px; margin-bottom: 12px; }
  .note b { color: var(--accent); }

          ${Object.entries(c.quiz.helpers).map(([id, h]) => `

              <div class="mate-name">${esc(h.name)}</div>
              <div class="mate-role">${esc(h.role)}</div>

        <div class="tasks">
          ${c.quiz.tasks.map((t, i) => `<button class="task" data-task="${i}"><i></i>${esc(t.text)}</button>`).join("")}

    ${c.gift ? `

    <section id="services">

            <div class="service-emoji${s.icon ? " ic" : ""}">${s.icon ? icon(s.icon) : esc(s.emoji)}</div>
            <div class="service-main">
              <div class="service-title">${esc(s.title)}</div>
              <div class="service-short">${esc(s.short)}</div>
            </div>
            <div class="service-price${s.price ? "" : " ask"}">${s.price ? esc(s.price) : "по запросу"}</div>
          </div>
          <div class="service-more">
            ${s.image ? `<img class="service-img" src="${esc(s.image)}" alt="${esc(s.title)}" loading="lazy">` : ""}
            ${has(s.options) ? `<div class="more-label">Варианты</div><div class="opts">${s.options.map(o => `<div class="opt"><span>${esc(o.label)}</span><b>${esc(o.price)}</b></div>`).join("")}</div>` : ""}

            <div class="row">
              <button class="btn ghost" data-url="${esc(s.post || c.bookingUrl)}">Узнать подробнее</button>

      ${c.pricing ? `
      <div class="terms">
        <div class="terms-title">${esc(c.pricing.title)}</div>

        <p>${esc(c.pricing.small)}</p>

    </section>

    ${has(c.cases) ? `
    <section id="cases">
      <h2>Кейсы<small>Оформление целиком: обложка, меню, баннеры. Откроются в канале ↗</small></h2>
      <div class="snake">
        <svg aria-hidden="true">
          <path class="track main" id="snakePath"/><path class="flow main"/>
          <circle class="spark" r="3.2"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#snakePath"/></animateMotion></circle>
          <circle class="spark" r="2.3"><animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite"><mpath href="#snakePath"/></animateMotion></circle>
          ${loneCase(c.cases) ? `
          <path class="track branch" id="branchPath"/><path class="flow branch"/>
          <circle class="spark" r="2.5"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#branchPath"/></animateMotion></circle>` : ""}
        </svg>
        ${c.cases.map((k, i) => {
          // Змейка: нечётные ряды идут слева направо, чётные — справа налево.
          // Если последний кейс один в ряду — он встаёт по центру
          const row = Math.floor(i / 3), pos = i % 3;
          const col = loneCase(c.cases) && i === c.cases.length - 1 ? 2 : row % 2 ? 3 - pos : pos + 1;
          return `
          <div class="case" style="grid-row:${row + 1};grid-column:${col}" data-url="${esc(k.url)}">
            <div class="case-num">${String(i + 1).padStart(2, "0")}</div>
            <div class="case-name">${esc(k.name)}</div>
            <div class="case-niche">${esc(k.niche)}</div>
          </div>`;
        }).join("")}
      </div>
    </section>` : ""}

    ${has(c.reviews) ? `
    <section id="reviews">
      <h2>Отзывы</h2>
      <div class="reviews">
        ${c.reviews.map(r => `
          <div class="review">
            <div class="quote">“</div>
            <p>${esc(r.text)}</p>
            <div class="who">${esc(r.name)} <span>· ${esc(r.about)}</span></div>
          </div>`).join("")}
      </div>
    </section>` : ""}

    ${has(c.useful) ? `
    <section id="useful">
      <h2>Полезное<small>Посты и подкасты откроются в канале ↗</small></h2>
      <div class="list">
        ${c.useful.map(p => `
          <div class="item" data-url="${esc(p.url)}">
            <div class="item-emoji${p.icon ? " ic" : ""}">${p.icon ? icon(p.icon) : esc(p.emoji)}</div>
            <div class="item-main">
              <div class="item-title">${esc(p.title)}</div>
              <div class="item-desc">${esc(p.desc)}</div>
            </div>
            <div class="item-arrow">›</div>
          </div>`).join("")}
      </div>
    </section>` : ""}

    <footer>
      <p>Спрашивайте что угодно — отвечаю сама</p>
      <p><a data-url="${esc(c.channelUrl)}">Кейсы и услуги</a> · <a data-url="${esc(c.aiChannelUrl)}">Канал про нейросети</a> · <a data-url="${esc(c.instagramUrl)}">Инстаграм</a></p>
    </footer>

    <div class="sticky-cta"><button class="btn" data-url="${esc(c.bookingUrl)}">${esc(c.bookingLabel)}</button></div>
  `;
}

// Золотые иконки (тонкие линии, рисуются цветом var(--gold))
const ICONS = {
  palette: '<path d="M12 3a9 9 0 1 0 0 18c1 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.5-1.1-.3-.3-.5-.7-.5-1.1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.1-4-7.6-9-7.6z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/><circle cx="17" cy="10.5" r="1"/>',
  layers: '<path d="M12 3 3 7.5l9 4.5 9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/>',
  key: '<circle cx="8" cy="15" r="4.5"/><path d="M11.2 11.8 20 3"/><path d="m16.5 6.5 3 3"/><path d="m14 9 2 2"/>',
  bot: '<rect x="4" y="8" width="16" height="11" rx="3.5"/><path d="M12 5v3"/><circle cx="12" cy="4" r="1"/><circle cx="9" cy="13.5" r="1.2"/><circle cx="15" cy="13.5" r="1.2"/><path d="M2 12.5v2.5M22 12.5v2.5"/>',
  target: '<circle cx="11" cy="13" r="8"/><circle cx="11" cy="13" r="4"/><path d="M11 13 19.5 4.5"/><path d="M16.5 4.5h3v3"/>',
  sparkle: '<path d="M11 3.5l1.8 5.2 5.2 1.8-5.2 1.8L11 17.5l-1.8-5.2L4 10.5l5.2-1.8z"/><path d="M18.5 15l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
  layout: '<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.4-3.8 4.2-5.7 7.5-5.7s6.1 1.9 7.5 5.7"/>',
  cap: '<path d="M2 9.5 12 4.5l10 5-10 5z"/><path d="M6 11.5v4.5c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/><path d="M22 9.5v5.5"/>',
  play: '<rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M10 9.3v5.4l4.6-2.7z"/>',

  phone: '<rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.3"/>',
  bag: '<path d="M5 8h14l-1 12.5H6z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/>',

function icon(name) {
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

// Последний кейс стоит один в ряду (например, 10-й при трёх в ряд)
function loneCase(cases) {
  return cases.length > 3 && cases.length % 3 === 1;
}

// Линия змейки кейсов: прямо между карточками в ряду, полукругом на поворотах.
// Одинокий последний кейс подключается отдельной линией от карточки над ним
function drawSnake() {
  const snake = document.querySelector(".snake");
  if (!snake) return;
  const box = snake.getBoundingClientRect();
  const cards = [...snake.querySelectorAll(".case")].map(el => {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2 - box.left, y: r.top + r.height / 2 - box.top, half: r.width / 2 };
  });
  if (cards.length < 2) return;
  const lone = loneCase(cards), main = lone ? cards.slice(0, -1) : cards;
  let d = `M${main[0].x} ${main[0].y}`;
  for (let i = 1; i < main.length; i++) {
    const a = main[i - 1], b = main[i];
    if (i % 3) { d += ` L${b.x} ${b.y}`; continue; }
    // Поворот на следующий ряд: дуга снаружи карточек
    const side = a.x > box.width / 2 ? 1 : -1, out = a.x + side * (a.half + 16);
    d += ` C${out} ${a.y} ${out} ${b.y} ${b.x} ${b.y}`;
  }
  snake.querySelectorAll("path.main").forEach(p => p.setAttribute("d", d));
  if (lone) {
    const above = cards[cards.length - 3], last = cards[cards.length - 1];
    snake.querySelectorAll("path.branch").forEach(p => p.setAttribute("d", `M${above.x} ${above.y} L${last.x} ${last.y}`));
  }
}

// Интерактив: отмеченные дела → помощники загораются, внизу тариф и кнопка в личку
const picked = new Set();
function updateQuiz(changedHelper) {
  const q = CONFIG.quiz, box = document.getElementById("verdict");
  if (!q || !box) return;
  const tasks = [...picked].sort((a, b) => a - b).map(i => q.tasks[i]);
  const helpers = [...new Set(tasks.map(t => t.helper).filter(Boolean))];
  const products = [...new Set(tasks.map(t => t.product).filter(Boolean))];
  document.querySelectorAll("[data-mate]").forEach(m => {
    const on = helpers.includes(m.dataset.mate);
    m.classList.toggle("on", on);
    if (on && m.dataset.mate === changedHelper) { m.classList.remove("pop"); void m.offsetWidth; m.classList.add("pop"); }
  });
  if (!tasks.length) { box.innerHTML = `<div class="hint">${esc(q.empty)}</div>`; return; }
  // Помощники одной группы (Машка и Макс) считаются как один
  const units = [...new Set(helpers.map(h => q.helpers[h].group || h))];
  let plan = units.length ? { ...q.plans.filter(p => units.length >= p.min).pop() } : null;
  if (plan && units.length === 1 && q.helpers[units[0]] && q.helpers[units[0]].hard) plan.price = q.helpers[units[0]].hard;
  const names = helpers.map(h => `${q.helpers[h].name} (${q.helpers[h].role})`);
  const pair = helpers.filter(h => q.helpers[h].group).length > 1;
  const card = (alt, label, title, price, why) =>
    `<div class="pick${alt ? " alt" : ""}"><div class="pick-label">${label}</div><div class="pick-row"><div class="pick-title">${esc(title)}</div><div class="pick-price">${esc(price)}</div></div><div class="pick-why">${esc(why)}</div></div>`;
  let html = plan ? card(false, "Вам подойдёт", plan.title, plan.price, (helpers.length > 1 ? "Возьмут на себя: " : "Возьмёт на себя: ") + names.join(", ") + (pair ? ". " + q.pairNote : "")) : "";
  products.forEach((id, n) => {
    const pr = q.products[id], alt = !!plan || n > 0;
    html += card(alt, alt ? "А ещё" : "Вам подойдёт", pr.title, pr.price, pr.why[0].toUpperCase() + pr.why.slice(1));
  });
  const offer = [plan && `${plan.title} (${plan.price})`, ...products.map(id => `${q.products[id].title} (${q.products[id].price})`)].filter(Boolean);
  const text = `Здравствуйте! Хочу отдать помощникам: ${tasks.map(t => t.text.toLowerCase()).join(", ")}. Мне подошло: ${offer.join("; ")}.`;
  html += `<button class="btn" data-url="${esc(CONFIG.bookingUrl + "?text=" + encodeURIComponent(text))}">${esc(q.button)}</button>`;
  box.innerHTML = html;
}

// Переписка помощников в шапке: сообщения по одному, перед ответом «печатает», потом пауза и повтор
function runChat() {
  const feed = document.getElementById("chatFeed");
  if (!feed) return;
  const items = CONFIG.chat, H = CONFIG.quiz.helpers;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const bubble = m => m.me
    ? `<div class="cm me"><div class="cm-b">${esc(m.text)}</div></div>`
    : `<div class="cm"><img src="${esc(H[m.who].photo)}" alt=""><div class="cm-b"><small>${esc(H[m.who].name)}</small>${esc(m.text)}</div></div>`;
  if (still) { feed.innerHTML = items.slice(-3).map(bubble).join(""); return; }
  const trim = () => { while (feed.children.length > 4) feed.firstElementChild.remove(); };
  let i = 0;
  const step = () => {
    if (i >= items.length) {
      setTimeout(() => { feed.classList.add("out"); setTimeout(() => { feed.classList.remove("out"); feed.innerHTML = ""; i = 0; step(); }, 450); }, 2600);
      return;
    }
    const m = items[i++];
    if (m.me) { feed.insertAdjacentHTML("beforeend", bubble(m)); trim(); setTimeout(step, 1000); return; }
    feed.insertAdjacentHTML("beforeend", `<div class="cm typing-row"><img src="${esc(H[m.who].photo)}" alt=""><div class="cm-b typing"><i></i><i></i><i></i></div></div>`);
    trim();
    setTimeout(() => {
      feed.lastElementChild.outerHTML = bubble(m);
      setTimeout(step, 1300);
    }, 800);
  };
  setTimeout(step, 600);
}

function bindEvents() {
  document.addEventListener("click", e => {
    const link = e.target.closest("[data-url]");
    if (link) { e.stopPropagation(); openUrl(link.dataset.url); return; }

    const go = e.target.closest("[data-go]");
    if (go) { haptic(); document.getElementById(go.dataset.go).scrollIntoView({ behavior: "smooth" }); return; }

    const task = e.target.closest("[data-task]");
    if (task) {
      haptic();
      const i = +task.dataset.task, on = !picked.has(i);
      on ? picked.add(i) : picked.delete(i);
      task.classList.toggle("on", on);
      updateQuiz(on ? CONFIG.quiz.tasks[i].helper : null);
      return;
    }

    const card = e.target.closest("[data-service]");
    if (card) { haptic(); card.classList.toggle("open"); }
  });
}

function initTelegram() {
  if (!inTelegram) return;
  document.body.classList.add("in-tg");
  tg.ready();
  tg.expand();
  const css = getComputedStyle(document.documentElement);
  const bg = css.getPropertyValue("--bg").trim();
  tg.setHeaderColor(bg);
  tg.setBackgroundColor(bg);

  // Родная кнопка Telegram внизу экрана
  tg.MainButton.setParams({
    text: CONFIG.bookingLabel,
    color: css.getPropertyValue("--main-btn").trim(),
    text_color: "#FFFFFF",
  });
  tg.MainButton.onClick(() => openUrl(CONFIG.bookingUrl));
  tg.MainButton.show();
}

render();
runChat();
updateQuiz();
bindEvents();
initTelegram();
drawSnake();
addEventListener("resize", drawSnake);
if (document.fonts) document.fonts.ready.then(drawSnake);
</script>
